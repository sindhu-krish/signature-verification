<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signature Similarity Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6dd5fa, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            background: #fff;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
        }

        button {
            background-color: #0078d7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #005fa3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .preview {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .preview img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Signature Similarity Checker</h1>

    <form id="uploadForm" enctype="multipart/form-data">
        <label>Select first signature:</label>
        <input type="file" id="file1" name="file1" accept="image/*" required />

        <label>Select second signature:</label>
        <input type="file" id="file2" name="file2" accept="image/*" required />

        <button type="submit">Compare</button>

        <div class="preview">
            <img id="preview1" src="#" alt="Signature 1 Preview" style="display:none;">
            <img id="preview2" src="#" alt="Signature 2 Preview" style="display:none;">
        </div>

        <div id="result"></div>
    </form>

    <script>
        // Show image previews
        document.getElementById('file1').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview1');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('file2').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview2');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            const resultDiv = document.getElementById('result');

            if (!file1 || !file2) {
                resultDiv.textContent = "Please select both signature files.";
                return;
            }

            const formData = new FormData();
            formData.append("file1", file1);
            formData.append("file2", file2);

            resultDiv.textContent = "Comparing signatures...";

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.textContent = `❌ ${data.error}`;
                } else {
                    resultDiv.textContent = `✅ Similarity: ${data.similarity}%`;
                }
            } catch (error) {
                resultDiv.textContent = "⚠ Error connecting to server.";
            }
        });
    </script>
</body>
</html>
